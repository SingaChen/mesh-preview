<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />
    <meta name="theme-color" content="#0e1218" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="description"
      content="Mobile WebGL previewer for SingaLab knitting mesh outputs"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <title>mesh-preview</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <h1>mesh-preview</h1>
          <p id="project-name">未打开项目 / No project</p>
        </div>
        <div class="open-menu" id="open-menu">
          <button class="btn primary" id="open-menu-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="open-menu-list">
            打开 <span class="en">Open</span>
          </button>
          <div class="open-menu-list" id="open-menu-list" role="menu" hidden>
            <button class="open-item" id="load-sample" type="button" role="menuitem">示例 <span class="en">Sample</span></button>
            <button class="open-item" id="open-folder" type="button" role="menuitem">文件夹 <span class="en">Folder</span></button>
            <button class="open-item" id="open-files" type="button" role="menuitem">文件 <span class="en">Files</span></button>
          </div>
        </div>
      </header>

      <main class="workspace" id="workspace">
        <div class="pane-switch" id="pane-switch" hidden>
          <button class="btn toggle" id="pane-3d" type="button" aria-pressed="true">3D</button>
          <button class="btn toggle" id="pane-map" type="button" aria-pressed="false">图 <span class="en">Map</span></button>
        </div>
        <div class="split" id="split">
          <section class="stage" id="stage-3d">
            <canvas id="viewport"></canvas>
            <div class="hud">
              <div class="hud-chips">
                <div class="chip">
                  <strong id="mesh-label">—</strong>
                  <span id="mesh-stats">打开项目或加载示例</span>
                </div>
                <div class="chip stitch-pick" id="stitch-pick" hidden>
                  <strong id="stitch-pick-title">针迹 Stitch</strong>
                  <span id="stitch-pick-text"></span>
                </div>
              </div>
              <div class="hud-actions">
                <button class="fit" id="hide-chrome" type="button" aria-expanded="true" title="Hide controls">收起 <span class="en">Hide</span></button>
                <button class="fit chrome-show" id="show-chrome" type="button" hidden aria-expanded="true" title="Show controls">控件 <span class="en">UI</span></button>
                <button class="fit" id="fit-view" type="button" title="Fit 3D">适应 <span class="en">Fit</span></button>
              </div>
            </div>
          </section>
          <section class="map-pane" id="map-pane" hidden>
            <div class="map-toolbar">
              <div class="map-title">
                <strong>生长图 <span class="en">Map</span></strong>
                <span id="map-meta">readable_map</span>
              </div>
              <div class="map-zoom">
                <button class="fit" id="map-zoom-out" type="button" title="Zoom out">−</button>
                <button class="fit" id="map-zoom-in" type="button" title="Zoom in">+</button>
                <button class="fit" id="map-fit" type="button" title="Fit map">适应 <span class="en">Fit</span></button>
              </div>
            </div>
            <canvas id="map-canvas"></canvas>
            <p class="map-empty" id="map-empty" hidden>无生长图 / No readable_map</p>
          </section>
        </div>
      </main>

      <section class="dock" id="dock">
        <div class="slider-row" id="mesh-row">
          <label for="mesh-slider">
            <span>网格 <span class="en">Mesh</span></span>
            <span class="meta" id="mesh-count">0 / 0</span>
          </label>
          <input id="mesh-slider" type="range" min="0" max="0" value="0" step="1" disabled />
        </div>
        <div class="dyn-controls">
          <div class="slider-row hidden" id="cols-row">
            <label id="cols-label">cols_resample: -</label>
            <div class="dual-range" id="cols-range" role="group" aria-label="cols_resample">
              <div class="dual-track"><div class="dual-fill"></div></div>
              <input class="dual-start" type="range" min="0" max="1" value="0" step="1" aria-label="cols_resample start" />
              <input class="dual-end" type="range" min="0" max="1" value="1" step="1" aria-label="cols_resample end" />
            </div>
          </div>
          <div class="slider-row hidden" id="faces-row">
            <div class="slider-heading">
              <label id="faces-label">row: -</label>
              <span class="slider-sub">faces_ring</span>
            </div>
            <div class="dual-range" id="faces-range" role="group" aria-label="row">
              <div class="dual-track"><div class="dual-fill"></div></div>
              <input class="dual-start" type="range" min="0" max="1" value="0" step="1" aria-label="row start" />
              <input class="dual-end" type="range" min="0" max="1" value="1" step="1" aria-label="row end" />
            </div>
          </div>
          <div class="slider-row hidden" id="terms-row">
            <div class="slider-heading">
              <label id="terms-label">term: -</label>
              <span class="slider-sub" id="terms-sub">term</span>
            </div>
            <div class="dual-range" id="terms-range" role="group" aria-label="term">
              <div class="dual-track"><div class="dual-fill"></div></div>
              <input class="dual-start" type="range" min="0" max="1" value="0" step="1" aria-label="term start" />
              <input class="dual-end" type="range" min="0" max="1" value="1" step="1" aria-label="term end" />
            </div>
          </div>
          <div class="slider-row hidden" id="models-row">
            <label id="models-label">display_models: -</label>
            <div class="dual-range" id="models-range" role="group" aria-label="display_models">
              <div class="dual-track"><div class="dual-fill"></div></div>
              <input class="dual-start" type="range" min="0" max="1" value="0" step="1" aria-label="display_models start" />
              <input class="dual-end" type="range" min="0" max="1" value="1" step="1" aria-label="display_models end" />
            </div>
          </div>
        </div>
        <div class="display-bar">
          <div class="base-menu" id="base-menu">
            <button class="btn toggle" id="base-menu-btn" type="button" aria-haspopup="true" aria-expanded="false" aria-pressed="false" aria-controls="base-menu-list">
              底模 <span class="en">Base</span>
            </button>
            <div class="base-menu-list" id="base-menu-list" hidden>
              <label class="base-check"><input type="checkbox" id="base-off" value="off" checked /> 隐藏 <span class="en">Off</span></label>
              <div class="base-menu-sep" role="separator"></div>
              <label class="base-check"><input type="checkbox" id="base-wire" value="wire" /> 线框 <span class="en">Wire</span></label>
              <label class="base-check"><input type="checkbox" id="base-faces" value="faces" /> 面 <span class="en">Faces</span></label>
              <label class="base-check"><input type="checkbox" id="base-points" value="points" /> 点 <span class="en">Points</span></label>
            </div>
          </div>
          <button class="btn toggle" id="toggle-warp" type="button" aria-pressed="true">列 <span class="en">Warp</span></button>
          <button class="btn toggle" id="toggle-overlay" type="button" aria-pressed="true">针迹 <span class="en">Stitch</span></button>
        </div>
        <div class="status" id="status"></div>
      </section>
    </div>

    <input
      id="folder-input"
      class="hidden-input"
      type="file"
      webkitdirectory
      directory
      multiple
    />
    <input
      id="files-input"
      class="hidden-input"
      type="file"
      accept=".obj,.json,.txt,.xls,.xlsx,model/obj,application/json,text/plain,application/vnd.ms-excel"
      multiple
    />
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
